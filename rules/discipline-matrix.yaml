# =============================================================================
# discipline-matrix.yaml — Disciplines, detection, element classes, who-moves,
# tolerances. Coordinator-editable. Consumed by core/rules (loader) and
# core/classify (engine). Spec: docs/domain/clash-taxonomy.md.
#
# CONVENTIONS (binding for the loader/engine)
# -----------------------------------------------------------------------------
# 1. Text normalization: every string value (property values, file names,
#    category names) is normalized BEFORE matching:
#      lowercase -> Unicode NFD -> strip combining marks (accents) -> trim ->
#      collapse internal whitespace to one space.
#    Therefore every regex and literal in this file is written in lowercase
#    without accents. Regex flavour = ECMAScript, applied with flag "i" anyway.
# 2. Element matchers use the SAME matcher DSL documented at the top of
#    rules/classification-rules.yaml (section "ELEMENT MATCHER").
# 3. Ordered lists are FIRST-MATCH-WINS unless stated otherwise.
# 4. Engine computation order per element:
#      normalize category (categoryAliases) -> modelDiscipline (fileName)
#      -> discipline (systemRefinement / category fallback) -> derivedFlags
#      (in listed order; later flags may reference earlier ones) ->
#      sizeMm -> elementClass (+ moveRank).
# =============================================================================
version: 1

# -----------------------------------------------------------------------------
# Disciplines. `code` is canonical (Chilean practice). `group` drives pair
# patterns ("@MEP", "@ARQ", ...). `criticality` (0..1) feeds priority scoring.
# -----------------------------------------------------------------------------
disciplines:
  - { code: ARQ,   group: ARQ,  criticality: 0.50, es: Arquitectura,                          en: Architecture,            aliases: [arq, arc, arch, ar, arquitectura, architecture] }
  - { code: INT,   group: ARQ,  criticality: 0.30, es: Interiorismo / Arquitectura interior,   en: Interiors,               aliases: [int, inter, interiorismo, interiors, id] }
  - { code: FAC,   group: ARQ,  criticality: 0.60, es: Fachada / Muro cortina,                en: Facade,                  aliases: [fac, fach, fachada, facade, mc, muro cortina, curtain wall] }
  - { code: MOB,   group: ARQ,  criticality: 0.20, es: Mobiliario / Equipamiento,             en: Furniture & equipment,   aliases: [mob, mobiliario, eq, equip, ffe, ff&e] }
  - { code: PAI,   group: ARQ,  criticality: 0.20, es: Paisajismo,                            en: Landscape,               aliases: [pai, pais, paisajismo, landscape, land] }
  - { code: EST,   group: EST,  criticality: 1.00, es: Estructura (calculo),                  en: Structure,               aliases: [est, estr, estructura, calculo, str, struct, structural, ing] }
  - { code: CLI,   group: MEP,  criticality: 0.70, es: Climatizacion (HVAC) y ventilacion,    en: HVAC,                    aliases: [cli, clima, climatizacion, hvac, mec, mech, mecanica, ven, vent, ventilacion, ext, extraccion, presurizacion] }
  - { code: CAL,   group: MEP,  criticality: 0.60, es: Calefaccion (hidronica / radiante),     en: Heating (hydronic),      aliases: [cal, calef, calefaccion, heating, hyd] }
  - { code: SAN,   group: MEP,  criticality: 0.75, es: Instalaciones sanitarias (combinado),  en: Plumbing (combined),     aliases: [san, sanit, sanitaria, sanitarias, ins, plumbing, plb, ph] }
  - { code: AP,    group: MEP,  criticality: 0.60, es: Agua potable (fria / caliente),        en: Domestic water,          aliases: [ap, apf, apc, agua potable, dw, dcw, dhw] }
  - { code: ALC,   group: MEP,  criticality: 0.85, es: Alcantarillado / aguas servidas,       en: Sanitary drainage,       aliases: [alc, alcantarillado, as, aguas servidas, sw, dr, drainage] }
  - { code: ALL,   group: MEP,  criticality: 0.85, es: Aguas lluvias,                         en: Storm drainage,          aliases: [all, aall, aguas lluvias, ll, storm, pluvial] }
  - { code: ELE,   group: MEP,  criticality: 0.60, es: Electricidad (fuerza y alumbrado),     en: Electrical,              aliases: [ele, elec, electricidad, electrical, el, ilu, iluminacion, fuerza] }
  - { code: CORR,  group: MEP,  criticality: 0.40, es: Corrientes debiles,                    en: Low voltage / ICT,       aliases: [corr, cd, cdeb, corrientes debiles, com, tel, ict, dat, datos, lv, cctv, seg] }
  - { code: INC,   group: MEP,  criticality: 0.90, es: "Proteccion contra incendio (red humeda, red seca, rociadores)", en: Fire protection, aliases: [inc, pci, incendio, fp, fire, rh, rs, red humeda, red seca, spk, rociadores, sprinkler] }
  - { code: GAS,   group: MEP,  criticality: 0.85, es: Gas,                                   en: Gas,                     aliases: [gas, gn, glp] }
  - { code: ASC,   group: ASC,  criticality: 0.85, es: Ascensores y montacargas,              en: Elevators,               aliases: [asc, ascensor, ascensores, elev, elevator, lift] }
  - { code: CIV,   group: CIV,  criticality: 0.50, es: Urbanizacion / obras civiles / pavimentacion, en: Civil / site,      aliases: [civ, urb, urbanizacion, pav, pavimentacion, civil, site, top, topografia] }
  - { code: COORD, group: COORD, criticality: 0.00, es: Coordinacion BIM (federado),         en: BIM coordination,        aliases: [coord, coordinacion, fed, federado, nwd, nwc] }
  - { code: UNK,   group: UNK,  criticality: 0.50, es: Desconocida,                           en: Unknown,                 aliases: [] }

# Group tokens usable in pair patterns. "@MEP" = any discipline whose group is MEP.
# "*" = any discipline. Pair patterns are UNORDERED.
groups: [ARQ, EST, MEP, ASC, CIV, COORD, UNK]

# -----------------------------------------------------------------------------
# Category normalization. Model Properties / viewer often returns "Revit Pipes"
# or localized "Revit Tuberias". Strip prefixes, then map aliases -> canonical
# English Revit category name. Unknown categories are kept as-is (normalized).
# Spanish names follow Revit es-ES localization (VERIFY against the project's
# Revit language; add aliases here, not in code).
# NOTE: in Revit es-ES "Techos" = Ceilings and "Cubiertas" = Roofs. In Chile
# people say "cielo" (ceiling) and "techumbre/cubierta" (roof). Do not confuse.
# -----------------------------------------------------------------------------
