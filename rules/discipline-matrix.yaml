  MEP_RUN_CATS:  [Pipes, Pipe Fittings, Pipe Accessories, Flex Pipes, Ducts, Duct Fittings, Duct Accessories, Flex Ducts, Cable Tray, Cable Tray Fittings, Conduits, Conduit Fittings]
  MEP_CONNECTED_CATS: [Pipes, Pipe Fittings, Pipe Accessories, Flex Pipes, Ducts, Duct Fittings, Duct Accessories, Flex Ducts, Cable Tray, Cable Tray Fittings, Conduits, Conduit Fittings, Sprinklers, Air Terminals, Plumbing Fixtures, Mechanical Equipment, Electrical Equipment, Pipe Insulation, Duct Insulation, Duct Linings]
