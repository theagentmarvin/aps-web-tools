    name: unclassified
    when: {}
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "@mover", severity: medium, confidence: 0.4, suggestedAction: create_issue, humanReview: true,
            rationale: "Interferencia entre {a.category} ({a.discipline}) y {b.category} ({b.discipline}) sin regla específica. Requiere revisión del coordinador." }

# =============================================================================
# ANNOTATIONS — all matching apply after classification. Output: tags + note.
# Same `when` syntax as rules. They never change validity/severity.
# =============================================================================
annotations:
  - id: ANN-001
    when: { a: { modelAgeDays: { gt: 21 } } }
    then: { tags: [modelo_desactualizado], note: "El modelo {a.documentName} tiene más de 21 días sin publicarse: confirmar que la interferencia sigue vigente antes de emitir incidencia." }
  - id: ANN-002
    when: { a: { anyOf: [ { discipline: [INC, GAS] }, { isFireRated: true }, { isFireDamper: true }, { elementClass: [stairs, elevator] } ] } }
    then: { tags: [seguridad_personas], note: "Involucra un sistema o recinto de seguridad de las personas (incendio, gas, evacuación)." }
  - id: ANN-003
    when: { clash: { penetrationMm: { gt: 300 } } }
    then: { tags: [penetracion_mayor], note: "Penetración mayor a 300 mm: sospechar nivel de referencia u offset incorrecto; revisar el elemento completo, no el punto." }
  - id: ANN-004
    when: { a: { isForeign: true } }
    then: { tags: [elemento_ajeno], note: "{a.category} modelado en un archivo de otra disciplina ({a.documentName})." }
  - id: ANN-005
    when: { a: { orientation: { exists: false }, elementClass: { inSet: MEP_DIST } } }
    then: { tags: [sin_orientacion], note: "Orientación no disponible; la regla aplicada puede ser genérica." }
  - id: ANN-006
    when: { a: { elementClass: { inSet: STRUCTURE } }, b: { elementClass: { inSet: MEP_ANY } } }
    then: { tags: [requiere_calculista], note: "Toda pasada en estructura requiere aprobación del ingeniero calculista." }
