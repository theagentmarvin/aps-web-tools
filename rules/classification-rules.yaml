    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: "$b", severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "Rociador obstruido por {b.category} de {b.discipline}. Reubicar el rociador o agregar uno bajo la obstrucción (criterio NFPA 13). Seguridad de las personas." }

  - id: ELV-001
    name: anything in elevator shaft
    when:
      a: { not: { isElevator: true } }
      b: { elementClass: elevator }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", secondaryDiscipline: ASC, severity: critical, confidence: 0.9, suggestedAction: create_issue,
            rationale: "{a.category} de {a.discipline} invade el ascensor/shaft '{b.family}'. El shaft de ascensor es de uso exclusivo: ninguna instalación ajena puede pasar por él." }

# ---------------------------------------------------------------------------
# EST — MEP vs structure. Structure does not move.
# ---------------------------------------------------------------------------
  - id: EST-001
    name: MEP through structural column
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: structure_column }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: critical, confidence: 0.92, suggestedAction: create_issue,
            rationale: "{a.category} {a.systemName} ({a.sizeMm} mm) atraviesa el pilar '{b.type}'. Los pilares no admiten pasadas: {a.discipline} debe desviar el trazado." }

  - id: EST-002
    name: gravity drainage vs structure (not vertical stacks)
    when:
      a: { elementClass: gravity_pipe, not: { orientation: vertical } }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: critical, confidence: 0.88, suggestedAction: create_issue,
            rationale: "Tubería gravitacional {a.systemType} Ø{a.sizeMm} mm interfiere {b.category} '{b.type}' ({clash.penetrationMm} mm). La pendiente limita el desvío: resolver con pasada aprobada por calculista o rediseño del trazado." }

  - id: EST-003
    name: MEP vs post-tensioned slab
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { isPostTensioned: true }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: critical, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} atraviesa losa postensada '{b.type}' sin pasada modelada. Las pasadas en losas postensadas deben coordinarse con el trazado de cables antes de hormigonar." }

  - id: EST-004
    name: large duct vs beam
    when:
      a: { elementClass: duct_large }
      b: { elementClass: structure_framing }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: critical, confidence: 0.88, suggestedAction: create_issue,
            rationale: "Ducto de {a.sizeMm} mm ({a.systemType}) interfiere la viga '{b.type}' (h={b.sizeMm} mm). Una pasada de este tamaño en viga rara vez es aceptable: revisar trazado, altura de entretecho o cajón." }

  - id: EST-005
    name: MEP >= 100 mm vs beam
    when:
      a: { elementClass: { inSet: MEP_DIST }, sizeMm: { gte: 100 } }
      b: { elementClass: structure_framing }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} de {a.sizeMm} mm atraviesa la viga '{b.type}'. Desviar bajo la viga o solicitar pasada al calculista (en general tercio central de la luz y diámetro ≤ h/3)." }

  - id: EST-006
    name: other MEP vs beam
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: structure_framing }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: medium, confidence: 0.8, suggestedAction: create_issue,
            rationale: "{a.category} ({a.sizeMm} mm) interfiere la viga '{b.type}' ({clash.penetrationMm} mm). Desviar o solicitar pasada aprobada por el calculista." }

  - id: EST-007
    name: MEP through structural (RC) wall
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: structure_wall }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.8, suggestedAction: create_issue,
            rationale: "{a.category} Ø/ancho {a.sizeMm} mm atraviesa muro estructural '{b.type}' sin pasada modelada. Los muros de hormigón armado resisten el sismo: toda pasada requiere aprobación del calculista y debe quedar modelada por EST." }

  - id: EST-008
    name: MEP vs foundation
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: structure_foundation }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} interfiere la fundación '{b.type}'. Las pasadas en fundaciones y vigas de fundación deben definirse antes de excavar; revisar cotas de redes enterradas." }

  - id: EST-009
    name: vertical MEP through structural slab (missing opening)
    when:
      a: { elementClass: { inSet: MEP_DIST }, orientation: vertical }
      b: { elementClass: structure_floor }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: EST, secondaryDiscipline: "$a", severity: medium, confidence: 0.8, suggestedAction: create_issue,
            rationale: "Montante de {a.discipline} Ø/ancho {a.sizeMm} mm cruza la losa '{b.type}' sin pasada modelada. Falta la pasada en el modelo EST (si el hueco cortara la losa no habría interferencia): {a.discipline} confirma medida/ubicación y EST la modela." }

  - id: EST-010
    name: horizontal MEP embedded in structural slab
    when:
      a: { elementClass: { inSet: MEP_DIST }, orientation: [horizontal, sloped] }
      b: { elementClass: structure_floor }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} horizontal de {a.sizeMm} mm queda embebido en la losa '{b.type}' ({clash.penetrationMm} mm). Probable error de cota o nivel de referencia: bajar al entretecho." }

  - id: EST-011
    name: MEP vs structural slab, orientation unknown
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: structure_floor }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: medium, confidence: 0.6, suggestedAction: create_issue, humanReview: true,
            rationale: "{a.category} ({a.sizeMm} mm) interfiere la losa '{b.type}' ({clash.penetrationMm} mm). Sin orientación disponible: revisar en visor si es un cruce vertical (falta pasada) o un tramo embebido (error de cota)." }

# ---------------------------------------------------------------------------
# AE — Architecture vs structure.
# ---------------------------------------------------------------------------
  - id: AE-001
    name: door/window vs structure
    when:
      a: { elementClass: door_window }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} '{a.type}' no coincide con el vano de {b.category} '{b.type}' ({clash.penetrationMm} mm). Coordinar vano entre ARQ y EST: ajustar puerta/ventana o solicitar modificación del vano al calculista." }

  - id: AE-002
    name: beam below ceiling
    when:
      a: { elementClass: ceiling }
      b: { elementClass: structure_framing }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "La viga '{b.type}' (h={b.sizeMm} mm) queda bajo la cota del cielo '{a.type}' ({clash.penetrationMm} mm). ARQ debe bajar el cielo, generar cajón/plafón o revisar altura libre." }

  - id: AE-003
    name: partition/floor modeled into structure (modeling noise)
    when:
      clash: { penetrationMm: { lte: 100 } }
      a: { elementClass: [arch_wall, arch_floor] }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: tolerated, nature: hard, rootCause: modeling_error, responsibleDiscipline: "$a", severity: none, confidence: 0.7, suggestedAction: mark_reviewed,
            rationale: "{a.category} '{a.type}' modelado hasta dentro de {b.category} ({clash.penetrationMm} mm): encuentro de modelado sin impacto constructivo." }

  - id: AE-004
    name: partition significantly overlapping structure
    when:
      a: { elementClass: [arch_wall, arch_floor] }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: real, nature: hard, rootCause: modeling_error, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: low, confidence: 0.65, suggestedAction: create_issue,
            rationale: "{a.category} '{a.type}' se superpone {clash.penetrationMm} mm con {b.category} '{b.type}'. Revisar ejes/espesores: posible desfase entre ARQ y EST." }

  - id: AE-005
    name: curtain wall vs structure
    when:
      a: { elementClass: curtain_wall }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: medium, confidence: 0.7, suggestedAction: create_issue,
            rationale: "Fachada/muro cortina '{a.type}' interfiere {b.category} '{b.type}'. Revisar canto de losa, anclajes y holgura de montaje." }

  - id: AE-006
    name: architectural stair vs structure
    when:
      a: { elementClass: stairs, disciplineGroup: ARQ }
      b: { elementClass: { inSet: STRUCTURE } }
    then: { validity: real, nature: hard, rootCause: modeling_error, responsibleDiscipline: "$a", secondaryDiscipline: EST, severity: medium, confidence: 0.6, suggestedAction: create_issue,
            rationale: "Escalera de ARQ '{a.type}' interfiere {b.category}. Verificar si duplica la escalera estructural o si hay incompatibilidad de cotas/huella." }

# ---------------------------------------------------------------------------
# MA — MEP vs architecture.
# ---------------------------------------------------------------------------
  - id: MA-001
    name: MEP vs stairs (headroom / egress)
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: stairs }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} invade la escalera '{b.type}': compromete altura libre de la vía de evacuación. Desviar fuera de la caja de escalera." }

  - id: MA-002
    name: MEP vs door/window opening
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: door_window }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{a.category} de {a.discipline} cruza el vano de {b.category} '{b.type}'. Los vanos no se mueven por instalaciones: desviar sobre dintel o rodear." }

  - id: MA-003
    name: MEP vs curtain wall / facade
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: curtain_wall }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", secondaryDiscipline: "$b", severity: high, confidence: 0.8, suggestedAction: create_issue,
            rationale: "{a.category} interfiere la fachada '{b.type}'. Cualquier pasada por fachada afecta estanqueidad y garantía del sistema: desviar o definir detalle con fachadista." }

  - id: MA-004
    name: vertical MEP drop through ceiling
    when:
      a: { elementClass: { inSet: MEP_DIST }, orientation: vertical }
      b: { elementClass: ceiling }
    then: { validity: tolerated, nature: hard, rootCause: not_applicable, responsibleDiscipline: COORD, severity: none, confidence: 0.8, suggestedAction: mark_reviewed,
            rationale: "Bajada vertical de {a.category} atraviesa el cielo hacia su terminal o artefacto: perforación esperada." }

  - id: MA-005
    name: MEP below ceiling level
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: ceiling }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", secondaryDiscipline: ARQ, severity: medium, confidence: 0.7, suggestedAction: create_issue,
            rationale: "{a.category} de {a.discipline} ({a.sizeMm} mm) queda bajo la cota de cielo '{b.type}' ({clash.penetrationMm} mm). Subir en el entretecho; si no hay altura, ARQ evalúa bajar cielo o cajón." }

  - id: MA-006
    name: MEP through fire-rated wall
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: arch_wall, isFireRated: true }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: ARQ, severity: medium, confidence: 0.8, suggestedAction: create_issue,
            rationale: "{a.category} atraviesa muro resistente al fuego '{b.type}'. Definir pasada con sello cortafuego certificado de igual resistencia (o compuerta en ductos) y modelarla." }

  - id: MA-007
    name: large MEP through partition
    when:
      a: { elementClass: { inSet: MEP_DIST }, sizeMm: { gt: 150 } }
      b: { elementClass: arch_wall }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: ARQ, severity: low, confidence: 0.7, suggestedAction: create_issue,
            rationale: "{a.category} de {a.sizeMm} mm atraviesa tabique '{b.type}': requiere vano con refuerzo de perfilería. ARQ debe incorporarlo." }

  - id: MA-013
    name: small MEP through wall with unknown fire rating
    when:
      a: { elementClass: { inSet: MEP_DIST }, sizeMm: { lte: 150 } }
      b: { elementClass: arch_wall, isFireRated: false, fireRating: { exists: false } }
    then: { validity: real, nature: hard, rootCause: model_hygiene, responsibleDiscipline: "$b", secondaryDiscipline: "$a", severity: low, confidence: 0.75, suggestedAction: hygiene_issue,
            rationale: "{a.category} de {a.sizeMm} mm atraviesa el muro '{b.type}', que no tiene resistencia al fuego informada. ARQ debe informar la RF: si el muro sectoriza (OGUC Título 4) la pasada requiere sello cortafuego certificado; si no, es pasada estándar de obra." }

  - id: MA-008
    name: MEP equipment/terminal vs wall
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: arch_wall }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$a", secondaryDiscipline: ARQ, severity: low, confidence: 0.65, suggestedAction: create_issue,
            rationale: "{a.category} '{a.family}' se incrusta en el muro '{b.type}' ({clash.penetrationMm} mm). Reubicar o confirmar que va embutido con nicho." }

  - id: MA-009
    name: MEP vs roof
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: roof }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: ARQ, severity: low, confidence: 0.65, suggestedAction: create_issue,
            rationale: "{a.category} atraviesa la cubierta '{b.type}'. Si es ventilación o salida prevista, ARQ debe incorporar el detalle de impermeabilización; si no, desviar." }

  - id: MA-010
    name: MEP vs non-structural floor
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: arch_floor }
    then: { validity: real, nature: hard, rootCause: missing_opening, responsibleDiscipline: "$a", secondaryDiscipline: "$b", severity: medium, confidence: 0.6, suggestedAction: create_issue, humanReview: true,
            rationale: "{a.category} interfiere el piso '{b.type}' de {b.discipline}. Verificar si es la losa real modelada por ARQ (falta pasada) o una capa de terminación." }

  - id: MA-011
    name: MEP vs furniture/casework
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: furniture }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "@mover", severity: low, confidence: 0.6, suggestedAction: create_issue,
            rationale: "{a.category} interfiere mobiliario '{b.family}'. Confirmar si el mobiliario es fijo (cocina, closet) antes de mover la instalación." }

  - id: MA-012
    name: MEP vs railing
    when:
      a: { elementClass: { inSet: MEP_ANY } }
      b: { elementClass: railing }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", severity: low, confidence: 0.7, suggestedAction: create_issue,
            rationale: "{a.category} interfiere la baranda '{b.type}'. Desviar la instalación." }

# ---------------------------------------------------------------------------
# MM — MEP vs MEP.
# ---------------------------------------------------------------------------
  - id: MM-001
    name: gravity vs gravity
    when:
      both: { elementClass: gravity_pipe }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: COORD, severity: high, confidence: 0.7, suggestedAction: escalate,
            rationale: "Cruce entre dos redes gravitacionales ({a.systemType} y {b.systemType}). Requiere estudio de cotas y pendientes en conjunto; lo decide coordinación con ambas especialidades." }

  - id: MM-002
    name: gravity vs other MEP
    when:
      a: { elementClass: gravity_pipe }
      b: { elementClass: { inSet: MEP_ANY } }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$b", secondaryDiscipline: "$a", severity: high, confidence: 0.85, suggestedAction: create_issue,
            rationale: "{b.category} de {b.discipline} cruza la red gravitacional {a.systemType} Ø{a.sizeMm} mm. La gravedad no se mueve: {b.discipline} desvía." }

  - id: MM-003
    name: gas vs electrical / low voltage
    when:
      a: { discipline: GAS }
      b: { discipline: [ELE, CORR] }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "@mover", secondaryDiscipline: GAS, severity: high, confidence: 0.8, suggestedAction: create_issue,
            rationale: "Red de gas interfiere {b.category} de {b.discipline}. Debe mantenerse la separación reglamentaria gas-electricidad (DS 66 SEC / RIC); desplaza {mover.discipline}." }

  - id: MM-004
    name: fire main vs MEP
    when:
      a: { elementClass: fire_main }
      b: { elementClass: { inSet: MEP_ANY } }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "@mover", secondaryDiscipline: INC, severity: high, confidence: 0.8, suggestedAction: create_issue,
            rationale: "Red troncal de incendio Ø{a.sizeMm} mm interfiere {b.category} de {b.discipline}. Sistema de seguridad: resolver con prioridad; desplaza {mover.discipline}." }

  - id: MM-005
    name: MEP equipment vs distribution
    when:
      a: { elementClass: mep_equipment }
      b: { elementClass: { inSet: MEP_DIST } }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: "$b", secondaryDiscipline: "$a", severity: medium, confidence: 0.75, suggestedAction: create_issue,
            rationale: "{b.category} de {b.discipline} atraviesa el equipo '{a.family}' de {a.discipline}. Los equipos se ubican por layout; la red se desvía." }

  - id: MM-006
    name: equipment vs equipment
    when:
      both: { elementClass: mep_equipment }
    then: { validity: real, nature: hard, rootCause: design_coordination, responsibleDiscipline: COORD, severity: medium, confidence: 0.7, suggestedAction: escalate,
            rationale: "Dos equipos ('{a.family}' de {a.discipline} y '{b.family}' de {b.discipline}) ocupan el mismo espacio. Requiere revisión de layout de sala técnica." }

  - id: MM-007
    name: insulation vs other system
    when:
      a: { elementClass: insulation }
      b: { elementClass: { inSet: MEP_ANY } }
    then: { validity: real, nature: clearance, rootCause: design_coordination, responsibleDiscipline: "@mover", severity: low, confidence: 0.75, suggestedAction: create_issue,
            rationale: "La aislación de {a.systemName} invade {b.category} de {b.discipline} ({clash.penetrationMm} mm): falta holgura para aislación. Desplaza {mover.discipline}." }

  - id: MM-008
    name: conduit vs MEP beyond tolerance
    when:
      a: { elementClass: conduit }
      b: { elementClass: { inSet: MEP_ANY } }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$a", severity: low, confidence: 0.85, suggestedAction: create_issue,
            rationale: "Conduit Ø{a.sizeMm} mm de {a.discipline} interfiere {b.category} de {b.discipline} ({clash.penetrationMm} mm). El conduit es lo más flexible: se desvía." }

  - id: MM-009
    name: terminal vs distribution
    when:
      a: { elementClass: mep_terminal }
      b: { elementClass: { inSet: MEP_DIST } }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "$b", secondaryDiscipline: ARQ, severity: medium, confidence: 0.75, suggestedAction: create_issue,
            rationale: "{b.category} de {b.discipline} pasa por el espacio de '{a.family}' ({a.discipline}). Los terminales siguen el plano de cielo aprobado: la red se desvía." }

  - id: MM-010
    name: distribution vs distribution (different systems)
    when:
      both: { elementClass: { inSet: MEP_DIST } }
    then: { validity: real, nature: hard, rootCause: routing_conflict, responsibleDiscipline: "@mover", secondaryDiscipline: "@other", severity: medium, confidence: 0.75, suggestedAction: create_issue,
            rationale: "{a.category} {a.systemName} ({a.sizeMm} mm) cruza {b.category} {b.systemName} ({b.sizeMm} mm). Según jerarquía de desplazamiento mueve {mover.discipline}." }

