name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Repo checks
        run: npm run check
      - name: Typecheck
        run: npm run typecheck
      - name: Tests
        run: npm test
        env:
          COORD_DATA_SOURCE: fixtures
